<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --bg:           #f7f8fa;
    --surface:      #ffffff;
    --surface2:     #eef0f6;
    --surface3:     #e0e4ee;
    --border:       #dde1eb;
    --border2:      #c8cdd9;
    --line:         #eeeef5;
    --text:         #1a1d23;
    --text2:        #6b7280;
    --text3:        #9aa3af;
    --text4:        #bcc4ce;
    --accent:       #1c5caa;
    --accent-hover: #4a8bc8;
    --red:          #c8281e;
    --green:        #22c55e;
    --orange:       #f97316;
  }

  [data-theme="dark"] {
    --bg:           #07111e;
    --surface:      #0a1929;
    --surface2:     #0d2240;
    --surface3:     #102b52;
    --border:       #1a3a62;
    --border2:      #1e4875;
    --line:         #0f2236;
    --text:         #f0f2f5;
    --text2:        #a8b8cc;
    --text3:        #5a7290;
    --text4:        #3a5270;
    --accent:       #1c5caa;
    --accent-hover: #4a8bc8;
    --red:          #c8281e;
    --green:        #22c55e;
    --orange:       #f97316;
  }

  html, body { height:100%; overflow:hidden; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

  /* Scrollbar */
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

  /* Transitions for theme switch */
  body, .theme-transition * {
    transition: background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease;
  }

  /* Animations */
  @keyframes fadeSlide      { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  @keyframes scaleIn        { from{opacity:0;transform:scale(0.96)}      to{opacity:1;transform:scale(1)}     }
  @keyframes slideInRight   { from{transform:translateX(100%)}           to{transform:translateX(0)}          }
  @keyframes slideDown      { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulseOpacity   { 0%,100%{opacity:1} 50%{opacity:0.25} }
  @keyframes countUp        { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* Form inputs */
  input, select, textarea { font-family:'Inter',sans-serif; }
  input:focus, select:focus { border-color:var(--accent-hover) !important; box-shadow:0 0 0 2px rgba(28,92,170,0.18); }
  select option { background:var(--surface2); color:var(--text); }

  /* Button hover states */
  .btn-ghost:hover { background:var(--surface2) !important; color:var(--text) !important; }
  .nav-tab:hover   { color:var(--text2) !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>

<!-- ════════ tasks.jsx — TaskRow (expandable) + TasksView with collapsible groups ════════ -->
<script type="text/babel">
const TaskRow = ({ task, onStatusChange }) => {
  const [open, setOpen] = React.useState(false);
  const s = STATUS[task.status] || STATUS.pending;
  const isDone = task.status === "done";
  const dueCol = task.urgency==="overdue" ? "#c8281e" : task.urgency==="soon" ? "#f97316" : "var(--text4)";
  const nextStatus = STATUS_CYCLE[(STATUS_CYCLE.indexOf(task.status)+1) % STATUS_CYCLE.length];

  const cycleStatus = (e) => {
    e.stopPropagation();
    onStatusChange(task.id, nextStatus);
  };

  return (
    <div>
      {/* ── Main row ── */}
      <div
        onClick={() => setOpen(x => !x)}
        style={{
          display:"flex", alignItems:"center", height:44,
          paddingRight:14,
          borderLeft:`5px solid ${s.bar}`,
          background: open
            ? `linear-gradient(90deg,${s.bar}18 0%,var(--surface) 220px)`
            : `linear-gradient(90deg,${s.bar}0a 0%,transparent 160px)`,
          borderBottom: open ? "none" : "1px solid var(--line)",
          cursor:"pointer",
          transition:"background 0.18s",
        }}
      >
        {/* Checkbox */}
        <div
          onClick={e => { e.stopPropagation(); onStatusChange(task.id, isDone ? "pending" : "done"); }}
          style={{
            width:15, height:15,
            border:`1.5px solid ${isDone ? "#22c55e" : "var(--border2)"}`,
            borderRadius:3, display:"flex", alignItems:"center", justifyContent:"center",
            fontSize:9, color:"#22c55e",
            background: isDone ? "rgba(34,197,94,0.14)" : "transparent",
            flexShrink:0, margin:"0 11px 0 12px",
            cursor:"pointer", transition:"all 0.15s",
          }}
        >{isDone ? "✓" : ""}</div>

        {/* Title */}
        <div style={{
          flex:1, fontSize:13.5, fontWeight:isDone ? 400 : 500,
          color:isDone ? "var(--text4)" : "var(--text)",
          textDecoration:isDone ? "line-through" : "none",
          letterSpacing:"-0.01em",
          whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", paddingRight:14,
        }}>{task.title}</div>

        <div style={{ width:116 }}><StatusBadge status={task.status} onClick={cycleStatus} /></div>
        <div style={{ width:70 }}><RoleDot role={task.role} /></div>
        <div style={{ width:126, fontSize:12.5, color:"var(--text4)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{task.project}</div>
        <div style={{ width:56, fontSize:11.5, color:dueCol, textAlign:"right", fontFamily:MONO, fontWeight:500 }}>{task.due}</div>
        <div style={{ width:22, textAlign:"center", fontSize:10, color:"var(--text4)", transition:"transform 0.2s", transform:open?"rotate(180deg)":"rotate(0deg)", flexShrink:0 }}>▾</div>
      </div>

      {/* ── Expanded detail ── */}
      {open && (
        <div style={{
          borderLeft:`5px solid ${s.bar}`,
          borderBottom:"1px solid var(--line)",
          background:`linear-gradient(90deg,${s.bar}0a 0%,var(--surface) 220px)`,
          padding:"10px 14px 14px 42px",
          animation:"fadeSlide 0.18s ease both",
        }}>
          {task.nextAction ? (
            <div style={{ display:"flex", gap:8, marginBottom:6, alignItems:"flex-start" }}>
              <span style={{ fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:"var(--accent-hover)", flexShrink:0, marginTop:2 }}>→ NEXT</span>
              <span style={{ fontSize:12.5, color:"var(--text2)", lineHeight:1.5 }}>{task.nextAction}</span>
            </div>
          ) : null}
          {task.notes ? (
            <div style={{ display:"flex", gap:8, marginBottom:6, alignItems:"flex-start" }}>
              <span style={{ fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:"var(--text4)", flexShrink:0, marginTop:2 }}>NOTES</span>
              <span style={{ fontSize:12, color:"var(--text3)", lineHeight:1.5 }}>{task.notes}</span>
            </div>
          ) : null}
          {!task.nextAction && !task.notes && (
            <div style={{ fontSize:12, color:"var(--text4)", fontStyle:"italic", marginBottom:6 }}>No next action — click Edit to add one.</div>
          )}
          <div style={{ display:"flex", gap:6, marginTop:10 }}>
            <button style={{ height:26, padding:"0 10px", border:"1px solid var(--border)", borderRadius:3, fontSize:11, fontWeight:600, color:"var(--text3)", background:"var(--surface2)", cursor:"pointer", fontFamily:SANS }}>Edit</button>
            <button onClick={cycleStatus} style={{ height:26, padding:"0 10px", border:`1px solid ${STATUS[nextStatus]?.border||"var(--border)"}`, borderRadius:3, fontSize:11, fontWeight:600, color:STATUS[nextStatus]?.color||"var(--text3)", background:STATUS[nextStatus]?.bg||"var(--surface2)", cursor:"pointer", fontFamily:SANS }}>
              → {STATUS[nextStatus]?.label}
            </button>
            <button style={{ height:26, padding:"0 10px", border:"1px solid rgba(200,40,30,0.25)", borderRadius:3, fontSize:11, fontWeight:600, color:"#c8281e", background:"rgba(200,40,30,0.07)", cursor:"pointer", fontFamily:SANS }}>Delete</button>
          </div>
        </div>
      )}
    </div>
  );
};

const TasksView = ({ tasks, onStatusChange, filter, search }) => {
  const [collapsed, setCollapsed] = React.useState({ done:true });
  const toggle = k => setCollapsed(c => ({ ...c, [k]:!c[k] }));

  const vis = tasks.filter(t => {
    if (filter === "overdue" && t.urgency !== "overdue") return false;
    if (filter === "blocked" && t.status !== "blocked") return false;
    if (search) {
      const q = search.toLowerCase();
      if (!t.title.toLowerCase().includes(q) &&
          !t.project.toLowerCase().includes(q) &&
          !t.role.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const groups = [
    { key:"in-progress", label:"In Progress", accent:"#4a8bc8" },
    { key:"blocked",     label:"Blocked",     accent:"#f97316" },
    { key:"pending",     label:"Pending",     accent:"var(--text3)" },
    { key:"done",        label:"Done",        accent:"#22c55e" },
  ];

  return (
    <div style={{ flex:1, overflow:"auto", minHeight:0 }}>
      {/* Column headers — sticky */}
      <div style={{ height:28, display:"flex", alignItems:"center", paddingLeft:5, paddingRight:14, background:"var(--surface2)", borderBottom:"1px solid var(--border)", position:"sticky", top:0, zIndex:10, flexShrink:0 }}>
        <div style={{ width:44 }}></div>
        <div style={{ flex:1,    fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text4)" }}>Task</div>
        <div style={{ width:116, fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text4)" }}>Status</div>
        <div style={{ width:70,  fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text4)" }}>Role</div>
        <div style={{ width:126, fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text4)" }}>Project</div>
        <div style={{ width:56,  fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text4)", textAlign:"right" }}>Due</div>
        <div style={{ width:22 }}></div>
      </div>

      {groups.map(g => {
        const total = tasks.filter(t => t.status === g.key).length;
        const rows  = vis.filter(t => t.status === g.key);
        if (!total) return null;
        return (
          <React.Fragment key={g.key}>
            {/* Group header */}
            <div
              onClick={() => toggle(g.key)}
              style={{
                height:32, display:"flex", alignItems:"center",
                padding:"0 14px 0 12px",
                background:"var(--surface2)",
                borderTop:"1px solid var(--border)", borderBottom:"1px solid var(--border)",
                gap:9, cursor:"pointer", userSelect:"none", whiteSpace:"nowrap", overflow:"hidden",
              }}
            >
              <div style={{
                width:7, height:7, borderRadius:"50%", background:g.accent, flexShrink:0,
                animation:g.key==="blocked" ? "pulseOpacity 2s ease infinite" : "none",
              }}></div>
              <span style={{ fontSize:11, fontWeight:700, letterSpacing:"0.11em", textTransform:"uppercase", color:g.accent }}>{g.label}</span>
              <span style={{ fontSize:11, fontFamily:MONO, color:"var(--text3)", fontWeight:500 }}>{total}</span>
              {vis.length !== tasks.length && rows.length > 0 && <span style={{ fontSize:10, color:"var(--text4)" }}>({rows.length} shown)</span>}
              <div style={{ marginLeft:"auto", fontSize:10, color:"var(--text4)", transition:"transform 0.2s", transform:collapsed[g.key] ? "rotate(-90deg)" : "rotate(0deg)" }}>▾</div>
            </div>

            {!collapsed[g.key] && rows.length === 0 && (
              <div style={{ padding:"12px 20px", fontSize:12, color:"var(--text4)", borderBottom:"1px solid var(--line)" }}>No matching tasks in this group</div>
            )}
            {!collapsed[g.key] && rows.map(t => (
              <TaskRow key={t.id} task={t} onStatusChange={onStatusChange} />
            ))}
          </React.Fragment>
        );
      })}

      {vis.length === 0 && (
        <div style={{ padding:"48px 20px", textAlign:"center", color:"var(--text4)", fontSize:13 }}>No tasks match — try clearing the filter</div>
      )}
    </div>
  );
};

Object.assign(window, { TasksView });
</script>

<script type="text/babel">

const App = () => {
  const [dark,         setDark]         = React.useState(true);
  const [tab,          setTab]          = React.useState("tasks");
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const [newTaskOpen,  setNewTaskOpen]  = React.useState(false);
  const [filter,       setFilter]       = React.useState("all");
  const [search,       setSearch]       = React.useState("");
  const [tasks,        setTasks]        = React.useState(TASKS);
  const [toast,        setToast]        = React.useState(null);

  // Apply theme to <html>
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }, [dark]);

  // Keyboard shortcuts
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); showToast("Saved"); }
      if (e.key === "n" && !e.metaKey) { setNewTaskOpen(true); }
      if (e.key === "Escape") { setSettingsOpen(false); setNewTaskOpen(false); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2000);
  };

  const onStatusChange = (id, next) => {
    setTasks(ts => ts.map(t => t.id === id ? { ...t, status:next } : t));
    showToast(`→ ${STATUS[next]?.label}`);
  };

  const onAddTask = (form) => {
    setTasks(ts => [{ ...form, id:Date.now(), urgency:"normal", notes:"" }, ...ts]);
    showToast("Task added");
  };

  // Derived metrics
  const openCount    = tasks.filter(t => t.status !== "done").length;
  const overdueCount = tasks.filter(t => t.urgency === "overdue").length;
  const blockedCount = tasks.filter(t => t.status === "blocked").length;

  const TABS = [
    { key:"tasks",     label:"Tasks",     count:tasks.length   },
    { key:"projects",  label:"Projects",  count:PROJECTS.length },
    { key:"payments",  label:"Payments",  count:""             },
    { key:"decisions", label:"Decisions", count:DECISIONS.length },
  ];

  return (
    <div className="theme-transition" style={{ height:"100dvh", display:"flex", flexDirection:"column", overflow:"hidden", position:"relative" }}>

      {/* ═══ Red top accent ═══ */}
      <div style={{ height:2, background:"var(--red)", flexShrink:0 }}></div>

      {/* ═══ HEADER ═══ */}
      <div style={{ height:62, borderBottom:"1px solid var(--border)", display:"flex", alignItems:"center", padding:"0 20px", background:"var(--surface)", flexShrink:0, gap:0 }}>

        {/* Logo + Wordmark */}
        <div style={{ display:"flex", alignItems:"center", gap:9, flexShrink:0 }}>
          <img src="LOGO.png" alt="Kneura" style={{ height:34, width:34, borderRadius:5, objectFit:"cover", display:"block" }} />
          <div>
            <div style={{ fontWeight:800, fontSize:14.5, letterSpacing:"0.02em", lineHeight:1, display:"flex", alignItems:"baseline", gap:1 }}>
              <span style={{ color:"var(--text)" }}>Kneura</span>
              <span style={{ color:"var(--accent)" }}>COMM</span>
              <span style={{ fontSize:8, color:"var(--text4)", marginLeft:1, lineHeight:1 }}>™</span>
            </div>
            <div style={{ fontSize:9.5, color:"var(--text4)", letterSpacing:"0.07em", textTransform:"uppercase", fontWeight:600, marginTop:3 }}>Command Centre</div>
          </div>
        </div>

        {/* Divider */}
        <div style={{ width:1, height:34, background:"var(--border)", margin:"0 22px", flexShrink:0 }}></div>

        {/* Metrics — numbers in MONO */}
        <div style={{ display:"flex", gap:26, flex:1, alignItems:"center" }}>
          {[
            { l:"Open",      v:openCount,           c:"var(--text)"         },
            { l:"Overdue",   v:overdueCount,         c:"var(--red)"          },
            { l:"Blocked",   v:blockedCount,         c:"var(--orange)"       },
            { l:"Revenue",   v:"£42k",               c:"var(--green)"        },

            onClick={() => setDark(d => !d)}
            title={dark ? "Switch to light" : "Switch to dark"}
            style={{ width:30, height:30, borderRadius:"50%", border:"1.5px solid var(--border)", background:"transparent", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", transition:"border-color 0.18s", flexShrink:0 }}
          >
            <div style={{
              width:10, height:10, borderRadius:"50%",
              background: dark ? "var(--text)" : "transparent",
              border: dark ? "none" : "2px solid var(--text)",
              transition:"all 0.18s",
            }}></div>
          </button>
        </div>
      </div>

      {/* ═══ NAV TABS + CONTROLS ═══ */}
      <div style={{ height:40, borderBottom:"1px solid var(--border)", display:"flex", alignItems:"stretch", padding:"0 20px", background:"var(--surface)", flexShrink:0 }}>
        {/* Tabs */}
        <div style={{ display:"flex", height:"100%" }}>
          {TABS.map(({ key, label, count }) => (
            <button
              key={key}
              className="nav-tab"
              onClick={() => { setTab(key); setFilter("all"); setSearch(""); }}
              style={{
                display:"flex", alignItems:"center", gap:5, padding:"0 15px",
                fontSize:12.5, fontWeight:tab === key ? 700 : 500,
                color: tab === key ? "var(--text)" : "var(--text3)",
                background:"transparent", border:"none",
                borderBottom: tab === key ? "2px solid var(--accent)" : "2px solid transparent",
                cursor:"pointer", fontFamily:SANS, letterSpacing:"-0.01em",
                transition:"color 0.15s", whiteSpace:"nowrap",
              }}
            >
              {label}
              {count !== "" && (
                <span style={{ fontSize:10.5, color:"var(--text4)", background:"var(--surface2)", padding:"1px 5px", borderRadius:3, fontFamily:MONO, fontWeight:600 }}>{count}</span>
              )}
            </button>
          ))}
        </div>

        {/* Task filters — only on Tasks tab */}
        {tab === "tasks" && (
          <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:5, animation:"slideDown 0.18s ease both" }}>
            {[["all","All"],["overdue","Overdue"],["blocked","Blocked"]].map(([val,lbl]) => (
              <button
                key={val}
                onClick={() => setFilter(val)}
                style={{
                  height:26, padding:"0 10px", cursor:"pointer",
                  border: filter === val ? "1.5px solid var(--text)" : "1px solid var(--border)",
                  borderRadius:3, fontSize:11.5, fontWeight:filter === val ? 700 : 500,
                  color: filter === val ? "var(--text)" : "var(--text3)",
                  background: filter === val ? "var(--surface2)" : "transparent",
                  fontFamily:SANS, transition:"all 0.12s",
                }}
              >{lbl}</button>
            ))}

            {/* Search */}
            <div style={{ display:"flex", alignItems:"center", height:26, border:"1px solid var(--border)", borderRadius:3, overflow:"hidden", background:"var(--surface2)", marginLeft:2 }}>
              <span style={{ padding:"0 7px", fontSize:11, color:"var(--text4)", flexShrink:0, fontFamily:MONO }}>⌘</span>
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search…"
                style={{ border:"none", background:"transparent", color:"var(--text)", fontFamily:SANS, fontSize:12.5, padding:"0 8px 0 0", outline:"none", width:140, height:"100%" }}
              />
            </div>
          </div>
        )}
      </div>

      {/* ═══ MAIN CONTENT ═══ */}
      <div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column", minHeight:0, background:"var(--bg)" }}>
        {tab === "tasks"     && <TasksView    tasks={tasks}      onStatusChange={onStatusChange} filter={filter} search={search} />}
        {tab === "projects"  && <ProjectsView projects={PROJECTS} />}
        {tab === "payments"  && <PaymentsView payments={PAYMENTS} />}
        {tab === "decisions" && <DecisionsView decisions={DECISIONS} />}
      </div>

      {/* ═══ FOOTER HINTS ═══ */}
      <div style={{ height:30, borderTop:"1px solid var(--border)", display:"flex", alignItems:"center", padding:"0 20px", background:"var(--surface)", flexShrink:0, justifyContent:"space-between" }}>
        <div style={{ display:"flex", gap:14, alignItems:"center" }}>
          <Kbd k="N" label="new" />
          <Kbd k="E" label="edit" />
          <Kbd k="/" label="search" />
          <Kbd k="G" label="group" />
          <Kbd k="⌘S" label="save" />
        </div>
        <span style={{ fontSize:11, color:"var(--text4)", fontFamily:MONO }}>Saved · just now</span>
      </div>

      {/* ═══ SETTINGS PANEL ═══ */}
      {settingsOpen && <SettingsPanel onClose={() => setSettingsOpen(false)} tasks={tasks} />}

      {/* ═══ NEW TASK MODAL ═══ */}
      {newTaskOpen && <NewTaskModal onClose={() => setNewTaskOpen(false)} onAdd={onAddTask} />}

      {/* ═══ TOAST ═══ */}
      {toast && (
        <div style={{
          position:"fixed", bottom:44, right:20,
          background:"var(--surface2)", border:"1px solid var(--border2)",
          borderRadius:7, padding:"9px 16px", fontSize:13, fontWeight:600,
          color:"var(--text)", zIndex:400,
          boxShadow:"0 8px 30px rgba(0,0,0,0.3)",
          animation:"fadeSlide 0.28s cubic-bezier(0.34,1.56,0.64,1) both",
          pointerEvents:"none",
        }}>{toast}</div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

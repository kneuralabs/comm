<!-- ════════════════════════════════════════════════════════════════
     DATA + PERSISTENCE LAYER
     Supabase cloud sync · localStorage · IndexedDB · debounced save
     ════════════════════════════════════════════════════════════════ -->
<script>
// ==================== UTILS ====================
function uid() { return Math.random().toString(36).slice(2,10); }
function fd(d) { return d instanceof Date ? d.toISOString().split('T')[0] : ''; }
function today() { return new Date().toISOString().split('T')[0]; }
function daysUntil(ds) { if (!ds) return null; return Math.round((new Date(ds) - new Date(today())) / 86400000); }
function dispDate(ds) { if (!ds) return ''; const d = new Date(ds); if (isNaN(d)) return String(ds); return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function isOverdue(t) { return t.status !== 'done' && t.due && daysUntil(t.due) < 0; }
function isDueSoon(t) { if (t.status === 'done' || !t.due) return false; const d = daysUntil(t.due); return d !== null && d >= 0 && d <= 2; }

// React-bridge hooks (set by the App)
function toast(msg) { if (window.__toast) window.__toast(msg); }
function _flashSaveBtn() { if (window.__flashSave) window.__flashSave(); }
function _showError() { toast('Save failed'); }

// ==================== SUPABASE SYNC ====================
const SB_URL = 'https://brysartqcjylgqwmnjkk.supabase.co';
const SB_KEY = 'sb_publishable_C5e5ViwIlW9dV14ZLi4O0A_ipIXhTB5';
const SB_TABLE = 'comm_state';
const SB_ROW = 'main';

let _sb = null;                 // Supabase client
let _cloudUpdatedAt = null;     // last-seen remote updated_at (for change detection)
let _cloudStatus = 'connecting';// connecting | live | offline

function initSupabase() {
  try {
    if (window.supabase && window.supabase.createClient) {
      _sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
    } else {
      _cloudStatus = 'offline';
      console.error('[ERROR] Supabase library not loaded');
    }
  } catch (e) { _cloudStatus = 'offline'; console.error('[ERROR] Supabase init failed:', e); }
}

// Read the shared workspace row → { data, updatedAt } | null
async function readDataFromCloud() {
  if (!_sb) return null;
  try {
    const { data, error } = await _sb.from(SB_TABLE).select('data, updated_at').eq('id', SB_ROW).maybeSingle();
    if (error) { console.error('[ERROR] Supabase read:', error.message); _cloudStatus = 'offline'; return null; }
    _cloudStatus = 'live';
    if (!data) return null;
    return { data: data.data || {}, updatedAt: data.updated_at };
  } catch (e) { _cloudStatus = 'offline'; console.error('[ERROR] Supabase read:', e); return null; }
}

// Upsert the current state to the shared workspace row
async function writeDataToCloud() {
  if (!_sb) return;
  try {
    const now = new Date().toISOString();
    const { error } = await _sb.from(SB_TABLE).upsert({ id: SB_ROW, data: S, updated_at: now }, { onConflict: 'id' });
    if (error) { _cloudStatus = 'offline'; console.error('[ERROR] Supabase write:', error.message); toast('Sync failed: ' + error.message); return; }
    _cloudStatus = 'live';
    _cloudUpdatedAt = now;
  } catch (e) { _cloudStatus = 'offline'; console.error('[ERROR] Supabase write:', e); }
}

// ==================== STATE ====================
let S = { revenue: 0, revenueAuto: false, roles: ['CEO','COO','CFO','CMO','CIO'], roleColors: {}, projects: [], archivedProjects: [], tasks: [], payments: [], decisions: [] };

// ==================== PERSIST ====================
const STORE = 'ops_cmd_v3', STORE_META = 'ops_cmd_v3_meta';
const IDB_NAME = 'kneuralabs_cmd', IDB_STORE = 'snapshots', IDB_KEY = 'main';
let _lastSavedAt = null, _idb = null, _saveDebounceTimer = null;

function _openIDB() {
  return new Promise((resolve) => {
    if (!window.indexedDB) { resolve(null); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore(IDB_STORE); };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => resolve(null);
  });
}
function _idbWrite(data) { if (!_idb) return; try { _idb.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(data, IDB_KEY); } catch(e) {} }
function _idbRead() {
  return new Promise(resolve => {
    if (!_idb) { resolve(null); return; }
    try { const req = _idb.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(IDB_KEY); req.onsuccess = () => resolve(req.result || null); req.onerror = () => resolve(null); }
    catch(e) { resolve(null); }
  });
}

function _writeToDisk() {
  const payload = JSON.stringify(S), now = new Date();
  try { localStorage.setItem(STORE, payload); localStorage.setItem(STORE_META, JSON.stringify({ savedAt: now.toISOString() })); }
  catch(e) { _showError(); return; }
  _idbWrite({ data: payload, savedAt: now.toISOString() });
  writeDataToCloud().catch(err => console.error('Cloud sync error:', err));
  _lastSavedAt = now;
  _flashSaveBtn();
}

// Auto-save: persist locally immediately, debounce the cloud push
function save() {
  const payload = JSON.stringify(S), now = new Date();
  try { localStorage.setItem(STORE, payload); localStorage.setItem(STORE_META, JSON.stringify({ savedAt: now.toISOString() })); } catch(e) {}
  _idbWrite({ data: payload, savedAt: now.toISOString() });
  clearTimeout(_saveDebounceTimer);
  _saveDebounceTimer = setTimeout(() => {
    _saveDebounceTimer = null;
    _lastSavedAt = new Date();
    _flashSaveBtn();
    writeDataToCloud().catch(err => console.error('Cloud sync error:', err));
  }, 1500);
}

function manualSave() { clearTimeout(_saveDebounceTimer); _saveDebounceTimer = null; _writeToDisk(); }

// Background sync: pull changes made on other devices
async function _syncFromCloud() {
  if (document.visibilityState !== 'visible') return;
  if (_saveDebounceTimer) return;
  if (!_sb) return;
  try {
    const { data, error } = await _sb.from(SB_TABLE).select('updated_at').eq('id', SB_ROW).maybeSingle();
    if (error || !data) return;
    if (!data.updated_at || data.updated_at === _cloudUpdatedAt) return;
    const remote = await readDataFromCloud();
    if (remote && remote.data && Object.keys(remote.data).length > 0) {
      _cloudUpdatedAt = remote.updatedAt;
      S = { ...S, ...remote.data };
      if (window.__refresh) window.__refresh();
      toast('↓ Synced');
    }
  } catch(e) {}
}

// Load: cloud first (source of truth), falling back to localStorage / IndexedDB (starts empty if none)
async function load() {
  _idb = await _openIDB();
  let loaded = false;
  try { const d = localStorage.getItem(STORE); if (d) { S = Object.assign({}, S, JSON.parse(d)); loaded = true; } } catch(e) {}
  if (!loaded) {
    const snap = await _idbRead();
    if (snap && snap.data) { try { S = Object.assign({}, S, JSON.parse(snap.data)); loaded = true; } catch(e) {} }
  }
  try { const m = localStorage.getItem(STORE_META); if (m) { const meta = JSON.parse(m); if (meta.savedAt) _lastSavedAt = new Date(meta.savedAt); } } catch(e) {}

  // Adopt the cloud copy unless our local copy is strictly newer (offline edits win until pushed)
  const remote = await readDataFromCloud();
  if (remote) {
    _cloudUpdatedAt = remote.updatedAt;
    const localNewer = _lastSavedAt && remote.updatedAt && new Date(_lastSavedAt) > new Date(remote.updatedAt);
    if (!localNewer && remote.data && Object.keys(remote.data).length > 0) {
      S = Object.assign({}, S, remote.data);
      loaded = true;
    }
  }

}

initSupabase();
</script>

<script type="text/babel">
const { useState, useEffect, useReducer, useMemo, Fragment } = React;

const MONO = "'JetBrains Mono','SF Mono','Courier New',monospace";
const SANS = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif";

const DEFAULT_ROLE_COLORS = { CEO:"#1c5caa", COO:"#4a8bc8", CFO:"#22c55e", CMO:"#a855f7", CIO:"#f59e0b" };
const FALLBACK_PALETTE = ["#1c5caa","#4a8bc8","#22c55e","#a855f7","#f59e0b","#f97316","#06b6d4","#ec4899"];

const STATUS = {
  "in-progress": { label:"In Progress", color:"#4a8bc8", bar:"#1c5caa", bg:"rgba(28,92,170,0.10)",  border:"rgba(74,139,200,0.28)" },
  "blocked":     { label:"Blocked",     color:"#f97316", bar:"#f97316", bg:"rgba(249,115,22,0.10)", border:"rgba(249,115,22,0.28)" },
  "pending":     { label:"Pending",     color:"#7a8899", bar:"#3a5270", bg:"rgba(58,82,112,0.08)",  border:"rgba(58,82,112,0.22)"  },
  "done":        { label:"Done",        color:"#22c55e", bar:"#22c55e", bg:"rgba(34,197,94,0.09)",  border:"rgba(34,197,94,0.25)"  },
};
const STATUS_CYCLE = ["pending","in-progress","blocked","done"];

function roleColor(role) {
  if (S.roleColors && S.roleColors[role]) return S.roleColors[role];
  if (DEFAULT_ROLE_COLORS[role]) return DEFAULT_ROLE_COLORS[role];
  let h = 0; for (let i=0;i<role.length;i++) h = (h*31 + role.charCodeAt(i)) >>> 0;
  return FALLBACK_PALETTE[h % FALLBACK_PALETTE.length];
}
function projectName(id) {
  const all = [...(S.projects||[]), ...(S.archivedProjects||[])];
  const p = all.find(x => x.id === id);
  return p ? p.name : (id || "—");
}
function urgencyOf(t) { return isOverdue(t) ? "overdue" : isDueSoon(t) ? "soon" : "normal"; }
function fmtMoneyShort(n) {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1000) { const k = n/1000; return "$" + (k % 1 === 0 ? k : k.toFixed(1)) + "k"; }
  return "$" + n.toLocaleString();
}
function fmtMoney(n) { return "$" + (Number(n)||0).toLocaleString(); }

/* ── Micro-components ── */
const StatusBadge = ({ status, onClick }) => {
  const s = STATUS[status] || STATUS.pending;
  return (
    <span onClick={onClick} className={onClick ? "kn-status-badge kn-press" : "kn-status-badge"} style={{
      fontSize:11, fontWeight:600, padding:"3px 9px", borderRadius:999,
      border:`1px solid ${s.border}`, background:s.bg, color:s.color,
      cursor:onClick?"pointer":"default", userSelect:"none",
      transition:"opacity 0.12s, transform 0.12s", whiteSpace:"nowrap",
      letterSpacing:"0.01em", fontFamily:SANS,
    }}>{s.label}</span>
  );
};
const RoleDot = ({ role }) => (
  <div style={{ display:"flex", alignItems:"center", gap:5, flexShrink:0 }}>
    <div style={{ width:6, height:6, borderRadius:"50%", background:roleColor(role), flexShrink:0 }}></div>
    <span style={{ fontSize:12, color:"var(--text3)", fontWeight:500 }}>{role}</span>
  </div>
);
const Kbd = ({ k, label }) => (
  <span style={{ fontSize:11, color:"var(--text4)", display:"flex", gap:4, alignItems:"center" }}>
    <span style={{ fontFamily:MONO, fontSize:10, padding:"1px 5px", border:"1px solid var(--border)", borderRadius:3, color:"var(--text3)", background:"var(--surface2)" }}>{k}</span>
    {label}
  </span>
);
const IconBtn = ({ icon, title, danger, onClick }) => (
  <button onClick={(e) => { e.stopPropagation(); onClick(); }} title={title} className="btn-ghost kn-press" style={{ width:28, height:28, flexShrink:0, borderRadius:8, border:"1px solid var(--border)", background:"transparent", color:danger?"var(--red)":"var(--text3)", cursor:"pointer", fontSize:12, fontFamily:SANS, display:"flex", alignItems:"center", justifyContent:"center", lineHeight:1, transition:"all 0.12s" }}>{icon}</button>
);
// Module-scoped so input focus is preserved across modal re-renders
const MLBL = { fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:"var(--text4)", display:"block", marginBottom:5 };
const Field = ({ label, children }) => (<div><label style={MLBL}>{label}</label>{children}</div>);

/* ── SF-style line icons for the mobile bottom tab bar ── */
const NAV_ICONS = {
  tasks:     "M4 6.5h11M4 12h11M4 17.5h7 M18 5.5l1.6 1.6L22.5 4 M18 11l1.6 1.6L22.5 9.5",
  projects:  "M3 7.5a2 2 0 0 1 2-2h3.4a2 2 0 0 1 1.6.8l.9 1.2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
  payments:  "M3 7.5h18a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z M2.5 11h19 M6 14.5h3",
  decisions: "M12 4l2.3 4.7 5.2.8-3.75 3.66.9 5.16L12 16.9l-4.65 2.42.9-5.16L4.5 9.5l5.2-.8z",
};
const TabIcon = ({ k, active }) => (
  <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth={active ? 2.1 : 1.8} strokeLinecap="round" strokeLinejoin="round"
    style={{ transition:"stroke-width 0.15s" }}>
    <path d={NAV_ICONS[k]} />
  </svg>
);

/* ── Task row (expandable) ── */
const TaskRow = ({ task, onStatusChange, onDelete, onEdit }) => {
  const [open, setOpen] = useState(false);
  const s = STATUS[task.status] || STATUS.pending;
  const isDone = task.status === "done";
  const urg = urgencyOf(task);
  const dueCol = urg==="overdue" ? "#c8281e" : urg==="soon" ? "#f97316" : "var(--text4)";
  const nextStatus = STATUS_CYCLE[(STATUS_CYCLE.indexOf(task.status)+1) % STATUS_CYCLE.length];
  const cycleStatus = (e) => { e.stopPropagation(); onStatusChange(task.id, nextStatus); };

  return (
    <div className="kn-task-card">
      <div onClick={() => setOpen(x => !x)} className="kn-task-row" style={{
        display:"flex", alignItems:"center", height:44, paddingRight:14,
        borderLeft:`5px solid ${s.bar}`,
        background: open ? `linear-gradient(90deg,${s.bar}18 0%,var(--surface) 220px)` : `linear-gradient(90deg,${s.bar}0a 0%,transparent 160px)`,
        borderBottom: open ? "none" : "1px solid var(--line)", cursor:"pointer", transition:"background 0.18s",
      }}>
        <div onClick={e => { e.stopPropagation(); onStatusChange(task.id, isDone ? "pending" : "done"); }}
          style={{ width:15, height:15, border:`1.5px solid ${isDone ? "#22c55e" : "var(--border2)"}`, borderRadius:3, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, color:"#22c55e", background: isDone ? "rgba(34,197,94,0.14)" : "transparent", flexShrink:0, margin:"0 11px 0 12px", cursor:"pointer", transition:"all 0.15s" }}>{isDone ? "✓" : ""}</div>
        <div style={{ flex:1, fontSize:13.5, fontWeight:isDone ? 400 : 500, color:isDone ? "var(--text4)" : "var(--text)", textDecoration:isDone ? "line-through" : "none", letterSpacing:"-0.01em", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", paddingRight:14 }}>{task.title}</div>
        <div className="kn-col-status" style={{ width:116 }}><StatusBadge status={task.status} onClick={cycleStatus} /></div>
        <div className="kn-col-role" style={{ width:70 }}><RoleDot role={task.role} /></div>
        <div className="kn-col-project" style={{ width:126, fontSize:12.5, color:"var(--text4)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{projectName(task.project)}</div>
        <div className="kn-col-due" style={{ width:56, fontSize:11.5, color:dueCol, textAlign:"right", fontFamily:MONO, fontWeight:500 }}>{dispDate(task.due)}</div>
        <div style={{ width:22, textAlign:"center", fontSize:10, color:"var(--text4)", transition:"transform 0.2s", transform:open?"rotate(180deg)":"rotate(0deg)", flexShrink:0 }}>▾</div>
      </div>
      {open && (
        <div style={{ borderLeft:`5px solid ${s.bar}`, borderBottom:"1px solid var(--line)", background:`linear-gradient(90deg,${s.bar}0a 0%,var(--surface) 220px)`, padding:"10px 14px 14px 42px", animation:"fadeSlide 0.18s ease both" }}>
          <div className="kn-row-meta" style={{ alignItems:"center", gap:14, marginBottom:9, flexWrap:"wrap" }}>
            <RoleDot role={task.role} />
            <span style={{ fontSize:12, color:"var(--text3)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:"60%" }}>{projectName(task.project)}</span>
            {task.due ? <span style={{ fontSize:11.5, color:dueCol, fontFamily:MONO, fontWeight:500 }}>{dispDate(task.due)}</span> : null}
          </div>
          {task.nextAction ? (
            <div style={{ display:"flex", gap:8, marginBottom:6, alignItems:"flex-start" }}>
              <span style={{ fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:"var(--accent-hover)", flexShrink:0, marginTop:2 }}>→ NEXT</span>
              <span style={{ fontSize:12.5, color:"var(--text2)", lineHeight:1.5 }}>{task.nextAction}</span>
            </div>
          ) : null}
          {task.notes ? (
            <div style={{ display:"flex", gap:8, marginBottom:6, alignItems:"flex-start" }}>
              <span style={{ fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:"var(--text4)", flexShrink:0, marginTop:2 }}>NOTES</span>
              <span style={{ fontSize:12, color:"var(--text3)", lineHeight:1.5 }}>{task.notes}</span>
            </div>
          ) : null}
          {!task.nextAction && !task.notes && (
            <div style={{ fontSize:12, color:"var(--text4)", fontStyle:"italic", marginBottom:6 }}>No next action recorded.</div>
          )}
          <div style={{ display:"flex", gap:6, marginTop:10 }}>
            <button onClick={cycleStatus} style={{ height:26, padding:"0 10px", border:`1px solid ${STATUS[nextStatus]?.border||"var(--border)"}`, borderRadius:3, fontSize:11, fontWeight:600, color:STATUS[nextStatus]?.color||"var(--text3)", background:STATUS[nextStatus]?.bg||"var(--surface2)", cursor:"pointer", fontFamily:SANS }}>→ {STATUS[nextStatus]?.label}</button>
            <button onClick={(e) => { e.stopPropagation(); onEdit(task); }} style={{ height:26, padding:"0 10px", border:"1px solid var(--border)", borderRadius:3, fontSize:11, fontWeight:600, color:"var(--text3)", background:"transparent", cursor:"pointer", fontFamily:SANS }}>Edit</button>
            <button onClick={(e) => { e.stopPropagation(); onDelete(task.id); }} style={{ height:26, padding:"0 10px", border:"1px solid rgba(200,40,30,0.25)", borderRadius:3, fontSize:11, fontWeight:600, color:"#c8281e", background:"rgba(200,40,30,0.07)", cursor:"pointer", fontFamily:SANS }}>Delete</button>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── Tasks view (grouped, collapsible) ── */
const TasksView = ({ tasks, onStatusChange, onDelete, onEdit, filter, search }) => {
  const [collapsed, setCollapsed] = useState({ done:true });
  const toggle = k => setCollapsed(c => ({ ...c, [k]:!c[k] }));

  const vis = tasks.filter(t => {
    if (filter === "overdue" && urgencyOf(t) !== "overdue") return false;
    if (filter === "blocked" && t.status !== "blocked") return false;
    if (search) {
      const q = search.toLowerCase();
      if (!(t.title||"").toLowerCase().includes(q) && !projectName(t.project).toLowerCase().includes(q) && !(t.role||"").toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const groups = [
    { key:"in-progress", label:"In Progress", accent:"#4a8bc8" },
    { key:"blocked",     label:"Blocked",     accent:"#f97316" },
    { key:"pending",     label:"Pending",     accent:"var(--text3)" },
    { key:"done",        label:"Done",        accent:"#22c55e" },
  ];

  const HEAD = { fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text4)" };
  return (
    <div className="kn-tasks-scroll" style={{ flex:1, overflow:"auto", minHeight:0 }}>
      <div className="kn-tasks-thead" style={{ height:28, display:"flex", alignItems:"center", paddingLeft:5, paddingRight:14, background:"var(--surface2)", borderBottom:"1px solid var(--border)", position:"sticky", top:0, zIndex:10, flexShrink:0 }}>
        <div style={{ width:44 }}></div>
        <div style={{ flex:1, ...HEAD }}>Task</div>
        <div style={{ width:116, ...HEAD }}>Status</div>
        <div className="kn-col-role" style={{ width:70, ...HEAD }}>Role</div>
        <div className="kn-col-project" style={{ width:126, ...HEAD }}>Project</div>
        <div style={{ width:56, ...HEAD, textAlign:"right" }}>Due</div>
        <div style={{ width:22 }}></div>
      </div>
      {groups.map(g => {
        const total = tasks.filter(t => t.status === g.key).length;
        const rows = vis.filter(t => t.status === g.key);
        if (!total) return null;
        return (
          <Fragment key={g.key}>
            <div onClick={() => toggle(g.key)} style={{ height:32, display:"flex", alignItems:"center", padding:"0 14px 0 12px", background:"var(--surface2)", borderTop:"1px solid var(--border)", borderBottom:"1px solid var(--border)", gap:9, cursor:"pointer", userSelect:"none", whiteSpace:"nowrap", overflow:"hidden" }}>
              <div style={{ width:7, height:7, borderRadius:"50%", background:g.accent, flexShrink:0, animation:g.key==="blocked" ? "pulseOpacity 2s ease infinite" : "none" }}></div>
              <span style={{ fontSize:11, fontWeight:700, letterSpacing:"0.11em", textTransform:"uppercase", color:g.accent }}>{g.label}</span>
              <span style={{ fontSize:11, fontFamily:MONO, color:"var(--text3)", fontWeight:500 }}>{total}</span>
              {vis.length !== tasks.length && rows.length > 0 && <span style={{ fontSize:10, color:"var(--text4)" }}>({rows.length} shown)</span>}
              <div style={{ marginLeft:"auto", fontSize:10, color:"var(--text4)", transition:"transform 0.2s", transform:collapsed[g.key] ? "rotate(-90deg)" : "rotate(0deg)" }}>▾</div>
            </div>
            {!collapsed[g.key] && rows.length === 0 && (
              <div style={{ padding:"12px 20px", fontSize:12, color:"var(--text4)", borderBottom:"1px solid var(--line)" }}>No matching tasks in this group</div>
            )}
            {!collapsed[g.key] && rows.map(t => (
              <TaskRow key={t.id} task={t} onStatusChange={onStatusChange} onDelete={onDelete} onEdit={onEdit} />
            ))}
          </Fragment>
        );
      })}
      {vis.length === 0 && (
        <div style={{ padding:"48px 20px", textAlign:"center", color:"var(--text4)", fontSize:13 }}>No tasks match — try clearing the filter</div>
      )}
    </div>
  );
};

/* ── Projects view ── */
const ProjectsView = ({ projects, tasks, onEdit, onDelete, onAddTask }) => (
  <div className="kn-content-pad" style={{ flex:1, overflow:"auto", padding:"24px 32px" }}>
    {projects.length === 0 && <div style={{ padding:"48px 20px", textAlign:"center", color:"var(--text4)", fontSize:13 }}>No projects yet — use “+ New Project” to create one</div>}
    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))", gap:16 }}>
      {projects.map((p, i) => {
        const pt = tasks.filter(t => t.project === p.id);
        const total = pt.length;
        const done = pt.filter(t => t.status === "done").length;
        const blocked = pt.filter(t => t.status === "blocked").length;
        const progress = total ? Math.round(done/total*100) : 0;
        const upcoming = pt.filter(t => t.due && t.status !== "done").sort((a,b)=>a.due.localeCompare(b.due))[0];
        const due = upcoming ? dispDate(upcoming.due) : "—";
        const barColor = blocked > 0 ? "#f97316" : progress > 70 ? "#22c55e" : "#1c5caa";
        return (
          <div key={p.id} className="kn-lift" style={{ background:`linear-gradient(105deg,${barColor}0d 0%,var(--surface) 56%)`, border:"1px solid var(--border)", borderLeft:`5px solid ${barColor}`, borderRadius:"var(--r-lg)", padding:"18px 20px", cursor:"default", boxShadow:"var(--sh-1)", animation:`fadeSlide 0.34s var(--ease-smooth) ${Math.min(i,9)*0.035}s both` }}>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:8, marginBottom:6 }}>
              <div style={{ fontSize:15, fontWeight:700, color:"var(--text)", lineHeight:1.35, flex:1, minWidth:0, letterSpacing:"-0.01em" }}>{p.name}</div>
              <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
                {blocked > 0 && (
                  <span style={{ fontSize:10, fontWeight:700, padding:"2px 6px", borderRadius:3, background:"rgba(249,115,22,0.12)", color:"#f97316", border:"1px solid rgba(249,115,22,0.25)", whiteSpace:"nowrap" }}>{blocked} blocked</span>
                )}
                <IconBtn icon="✎" title="Edit project" onClick={() => onEdit(p)} />
                <IconBtn icon="✕" title="Delete project" danger onClick={() => onDelete(p.id)} />
              </div>
            </div>
            <div style={{ fontSize:11, color:"var(--text4)", marginBottom:10 }}>{p.role || p.desc || "—"}</div>
            <div style={{ height:3, background:"var(--border)", borderRadius:2, marginBottom:9, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${progress}%`, background:barColor, borderRadius:2, transition:"width 0.9s cubic-bezier(0.22,1,0.36,1)" }}></div>
            </div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <span style={{ fontSize:12, color:"var(--text3)", fontFamily:MONO }}>
                {done}<span style={{ color:"var(--text4)" }}>/{total}</span>
                <span style={{ color:"var(--text4)", fontFamily:SANS, fontSize:11, marginLeft:5 }}>tasks</span>
              </span>
              <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                <span style={{ fontSize:12.5, fontWeight:700, color:barColor, fontFamily:MONO }}>{progress}%</span>
                <span style={{ fontSize:11, color:"var(--text4)", fontFamily:MONO }}>{due}</span>
              </div>
            </div>
            <button onClick={() => onAddTask(p.id)} className="btn-ghost" style={{ marginTop:11, width:"100%", height:30, border:"1px dashed var(--border2)", borderRadius:4, background:"transparent", color:"var(--text3)", fontSize:11.5, fontWeight:600, cursor:"pointer", fontFamily:SANS, transition:"all 0.12s" }}>+ Add task</button>
          </div>
        );
      })}
    </div>
  </div>
);

/* ── Payments view ── */
const PaymentsView = ({ payments, onToggle, onEdit, onDelete }) => {
  const statusOf = (p) => p.status === "received" ? "received" : (p.due && daysUntil(p.due) < 0 ? "overdue" : "pending");
  const sum = (pred) => payments.filter(pred).reduce((acc, p) => acc + Number(p.amount || 0), 0);
  const outstanding = sum(p => statusOf(p) !== "received");
  const received = sum(p => statusOf(p) === "received");
  const overdue = sum(p => statusOf(p) === "overdue");
  return (
    <div className="kn-content-pad" style={{ flex:1, overflow:"auto", padding:"24px 32px" }}>
      <div className="kn-pay-tiles" style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:14, marginBottom:22 }}>
        {[
          { label:"Outstanding", value:fmtMoney(outstanding), color:"var(--accent-hover)", bar:"var(--accent)" },
          { label:"Received",    value:fmtMoney(received),    color:"#22c55e",             bar:"#22c55e" },
          { label:"Overdue",     value:fmtMoney(overdue),     color:"#c8281e",             bar:"#c8281e" },
        ].map(tile => (
          <div key={tile.label} className="kn-lift" style={{ padding:"15px 18px", background:`linear-gradient(105deg,${tile.bar}10 0%,var(--surface) 60%)`, border:"1px solid var(--border)", borderLeft:`5px solid ${tile.bar}`, borderRadius:"var(--r-md)", boxShadow:"var(--sh-1)" }}>
            <div style={{ fontSize:9.5, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text4)", marginBottom:7 }}>{tile.label}</div>
            <div style={{ fontSize:28, fontWeight:800, color:tile.color, fontFamily:MONO, letterSpacing:"-0.03em" }}>{tile.value}</div>
          </div>
        ))}
      </div>
      {payments.length === 0 && <div style={{ padding:"32px 20px", textAlign:"center", color:"var(--text4)", fontSize:13 }}>No payments recorded</div>}
      {payments.map((p, i) => {
        const st = statusOf(p);
        const sc = st === "received" ? "#22c55e" : st === "overdue" ? "#c8281e" : "#f59e0b";
        return (
          <div key={p.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 17px", marginBottom:8, background:`linear-gradient(90deg,${sc}09 0%,var(--surface) 180px)`, border:"1px solid var(--border)", borderLeft:`5px solid ${sc}`, borderRadius:"var(--r-md)", boxShadow:"var(--sh-1)", animation:`fadeSlide 0.3s var(--ease-smooth) ${Math.min(i,9)*0.03}s both` }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13.5, fontWeight:600, color:"var(--text)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{p.client || "—"}</div>
              {p.notes ? <div style={{ fontSize:11, color:"var(--text4)", fontFamily:MONO, marginTop:2 }}>{p.notes}</div> : null}
            </div>
            <div style={{ fontSize:16, fontWeight:800, color:"var(--text)", fontFamily:MONO, flexShrink:0 }}>{fmtMoney(p.amount)}</div>
            <div style={{ fontSize:11.5, color:"var(--text4)", fontFamily:MONO, width:52, textAlign:"right", flexShrink:0 }}>{dispDate(p.due)}</div>
            <button onClick={() => onToggle(p.id)} className="kn-press" style={{ height:30, padding:"0 13px", border:"none", borderRadius:999, fontSize:11, fontWeight:700, cursor:"pointer", fontFamily:SANS, flexShrink:0, background: st === "received" ? "rgba(34,197,94,0.12)" : st === "overdue" ? "rgba(200,40,30,0.1)" : "rgba(245,158,11,0.12)", color: sc }}>
              {st === "received" ? "✓ Received" : st === "overdue" ? "Overdue" : "Pending"}
            </button>
            <IconBtn icon="✎" title="Edit payment" onClick={() => onEdit(p)} />
            <IconBtn icon="✕" title="Delete payment" danger onClick={() => onDelete(p.id)} />
          </div>
        );
      })}
    </div>
  );
};

/* ── Decisions view ── */
const DecisionsView = ({ decisions, onEdit, onDelete }) => (
  <div className="kn-content-pad" style={{ flex:1, overflow:"auto", padding:"24px 32px" }}>
    <div style={{ maxWidth:820 }}>
      {decisions.length === 0 && <div style={{ padding:"32px 0", color:"var(--text4)", fontSize:13 }}>No decisions logged yet — use “+ New Decision” to log one</div>}
      {decisions.map((d, i) => {
        const parsed = new Date(d.ts);
        const valid = d.ts && !isNaN(parsed);
        const dateStr = valid ? parsed.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : (d.ts || "");
        const timeStr = valid ? parsed.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}) : "";
        return (

/* ════════════════════════════ APP ════════════════════════════ */
const App = () => {
  const [, force] = useReducer(x => x + 1, 0);
  const [ready, setReady] = useState(false);
  const [dark, setDark] = useState(document.documentElement.getAttribute("data-theme") !== "light");
  const [tab, setTab] = useState("tasks");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [modal, setModal] = useState(null); // { kind:'task'|'project'|'payment'|'decision', item? }
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [toastMsg, setToastMsg] = useState(null);

  const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };
  const commit = () => { save(); force(); };

  // Wire React bridge hooks for the persistence layer + boot
  useEffect(() => {
    window.__toast = showToast;
    window.__refresh = () => force();
    window.__flashSave = () => {};
    (async () => { await load(); setReady(true); force(); })();
    const sync = setInterval(() => { _syncFromCloud(); }, 30000);
    return () => { clearInterval(sync); window.__toast = null; window.__refresh = null; window.__flashSave = null; };
  }, []);

  // Theme
  useEffect(() => {
    const th = dark ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", th);
    try { localStorage.setItem("theme", th); } catch(e) {}
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = dark ? "#07111e" : "#f7f8fa";
  }, [dark]);

  // Keyboard shortcuts
  useEffect(() => {
    const handler = (e) => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
        if (e.key === "Escape") e.target.blur();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); manualSave(); showToast("Saved"); }
      else if (e.key === "n" && !e.metaKey && !e.ctrlKey) { if (!(S.projects||[]).length) { showToast("Create a project first"); setModal({ kind:"project" }); } else { setModal({ kind:"task" }); } }
      else if (e.key === "/") { e.preventDefault(); const el = document.getElementById("kn-search"); if (el) el.focus(); }
      else if (e.key === "Escape") { setSettingsOpen(false); setModal(null); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  // Mutations
  const onStatusChange = (id, next) => { S.tasks = S.tasks.map(t => t.id === id ? { ...t, status:next } : t); commit(); showToast(`→ ${STATUS[next]?.label}`); };
  const onDeleteTask = (id) => { if (!window.confirm("Delete this task?")) return; S.tasks = S.tasks.filter(t => t.id !== id); commit(); showToast("Task deleted"); };

  // Save (add or edit) for every entity
  const saveTask = (f) => {
    if (f.id) { S.tasks = S.tasks.map(t => t.id === f.id ? { ...t, title:f.title.trim(), status:f.status, role:f.role, project:f.project, due:f.due, nextAction:f.nextAction, notes:f.notes||"" } : t); showToast("Task updated"); }
    else { S.tasks = [{ id:uid(), title:f.title.trim(), role:f.role, project:f.project, priority:f.priority||"medium", status:f.status, due:f.due, nextAction:f.nextAction, notes:f.notes||"", created:new Date().toISOString() }, ...S.tasks]; showToast("Task added"); }
    commit();
  };
  const saveProject = (f) => {
    if (f.id) { S.projects = S.projects.map(p => p.id === f.id ? { ...p, name:f.name.trim(), role:f.role, desc:f.desc } : p); showToast("Project updated"); }
    else { S.projects = [{ id:uid(), name:f.name.trim(), role:f.role, desc:f.desc }, ...S.projects]; showToast("Project added"); }
    commit();
  };
  const deleteProject = (id) => {
    const n = (S.tasks||[]).filter(t => t.project === id).length;
    if (!window.confirm(`Delete this project${n ? ` and its ${n} task(s)` : ""}?`)) return;
    S.projects = (S.projects||[]).filter(p => p.id !== id);
    S.tasks = (S.tasks||[]).filter(t => t.project !== id);
    commit(); showToast("Project deleted");
  };
  const savePayment = (f) => {
    if (f.id) { S.payments = S.payments.map(p => p.id === f.id ? { ...p, client:f.client.trim(), amount:f.amount, due:f.due, status:f.status, notes:f.notes } : p); showToast("Payment updated"); }
    else { S.payments = [{ id:uid(), client:f.client.trim(), amount:f.amount, due:f.due, status:f.status||"pending", notes:f.notes }, ...(S.payments||[])]; showToast("Payment added"); }
    commit();
  };
  const deletePayment = (id) => { if (!window.confirm("Delete this payment?")) return; S.payments = (S.payments||[]).filter(p => p.id !== id); commit(); showToast("Payment deleted"); };
  const saveDecision = (f) => {
    const ts = f.date ? new Date(f.date).toISOString() : (f.ts || new Date().toISOString());
    if (f.id) { S.decisions = S.decisions.map(d => d.id === f.id ? { ...d, note:f.note.trim(), ts } : d); showToast("Decision updated"); }
    else { S.decisions = [{ id:uid(), ts, note:f.note.trim() }, ...(S.decisions||[])]; showToast("Decision logged"); }
    commit();
  };
  const deleteDecision = (id) => { if (!window.confirm("Delete this decision?")) return; S.decisions = (S.decisions||[]).filter(d => d.id !== id); commit(); showToast("Decision deleted"); };

  const saveEntity = (kind, f) => ({ task:saveTask, project:saveProject, payment:savePayment, decision:saveDecision }[kind])(f);
  const deleteEntity = (kind, id) => ({ task:onDeleteTask, project:deleteProject, payment:deletePayment, decision:deleteDecision }[kind])(id);

  // Open the right "new" modal for the active tab (tasks must live inside a project)
  const startNew = () => {
    if (tab === "tasks") {
      if (!(S.projects||[]).length) { showToast("Create a project first"); setModal({ kind:"project" }); return; }
      setModal({ kind:"task" });
    } else { setModal({ kind: tab.slice(0, -1) }); }
  };

  const onTogglePayment = (id) => { S.payments = S.payments.map(p => p.id === id ? { ...p, status: p.status === "received" ? "pending" : "received" } : p); commit(); };
  const onAddRole = () => {
    const name = (window.prompt("New role name (e.g. CTO):") || "").trim();
    if (!name) return;
    if ((S.roles||[]).includes(name)) { showToast("Role already exists"); return; }
    S.roles = [...(S.roles||[]), name];
    S.roleColors = { ...(S.roleColors||{}), [name]: FALLBACK_PALETTE[(S.roles.length-1) % FALLBACK_PALETTE.length] };
    commit(); showToast("Role added");
  };
  const onRenameRole = (oldName) => {
    const name = (window.prompt("Rename role:", oldName) || "").trim();
    if (!name || name === oldName) return;
    S.roles = (S.roles||[]).map(r => r === oldName ? name : r);
    if (S.roleColors && S.roleColors[oldName]) { S.roleColors[name] = S.roleColors[oldName]; delete S.roleColors[oldName]; }
    S.tasks = S.tasks.map(t => t.role === oldName ? { ...t, role:name } : t);
    commit(); showToast("Role renamed");
  };

  // Derived
  const tasks = S.tasks || [];
  const openCount = tasks.filter(t => t.status !== "done").length;
  const overdueCount = tasks.filter(t => urgencyOf(t) === "overdue").length;
  const blockedCount = tasks.filter(t => t.status === "blocked").length;
  const autoRev = (S.payments||[]).filter(p => p.status === "received").reduce((s,p)=>s+Number(p.amount||0),0);
  const revenue = S.revenueAuto ? autoRev : (S.revenue || 0);

  const TABS = [
    { key:"tasks",     label:"Tasks",     count:tasks.length },
    { key:"projects",  label:"Projects",  count:(S.projects||[]).length },
    { key:"payments",  label:"Payments",  count:"" },
    { key:"decisions", label:"Decisions", count:(S.decisions||[]).length },
  ];

  const metrics = [
    { l:"Open",      v:openCount,                c:"var(--text)"   },
    { l:"Overdue",   v:overdueCount,             c:"var(--red)"    },
    { l:"Blocked",   v:blockedCount,             c:"var(--orange)" },
    { l:"Revenue",   v:fmtMoneyShort(revenue),   c:"var(--green)"  },
    { l:"Decisions", v:(S.decisions||[]).length, c:"var(--text)"   },
  ];

  if (!ready) {
    return (
      <div style={{ height:"100dvh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:18, background:"var(--bg)" }}>
        <img src="LOGO.png" alt="Kneura" style={{ height:52, width:52, borderRadius:12, objectFit:"cover", boxShadow:"var(--sh-2)", animation:"breathe 1.8s ease-in-out infinite" }} />
        <div style={{ width:22, height:22, borderRadius:"50%", border:"2.5px solid var(--border2)", borderTopColor:"var(--accent)", animation:"spin 0.7s linear infinite" }}></div>
      </div>
    );
  }

  return (
    <div className="theme-transition" style={{ height:"100dvh", display:"flex", flexDirection:"column", overflow:"hidden", position:"relative" }}>
      <div style={{ height:2, background:"var(--red)", flexShrink:0 }}></div>

      {/* HEADER */}
      <div className="kn-header" style={{ height:62, borderBottom:"1px solid var(--border)", display:"flex", alignItems:"center", padding:"0 32px", background:"var(--surface)", flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:9, flexShrink:0 }}>
          <img src="LOGO.png" alt="Kneura" style={{ height:34, width:34, borderRadius:9, objectFit:"cover", display:"block", boxShadow:"var(--sh-1)" }} />
          <div>
            <div style={{ fontWeight:800, fontSize:14.5, letterSpacing:"0.02em", lineHeight:1, display:"flex", alignItems:"baseline", gap:1 }}>
              <span style={{ color:"var(--text)" }}>Kneura</span>
              <span style={{ color:"var(--accent)" }}>COMM</span>
              <span style={{ fontSize:8, color:"var(--text4)", marginLeft:1, lineHeight:1 }}>™</span>
            </div>
            <div style={{ fontSize:9.5, color:"var(--text4)", letterSpacing:"0.07em", textTransform:"uppercase", fontWeight:600, marginTop:3 }}>Command Centre</div>
          </div>
        </div>
        <div className="kn-divider" style={{ width:1, height:34, background:"var(--border)", margin:"0 22px", flexShrink:0 }}></div>
        <div className="kn-metrics" style={{ display:"flex", gap:26, flex:1, alignItems:"center" }}>
          {metrics.map(m => (
            <div key={m.l} style={{ display:"flex", flexDirection:"column", gap:1, cursor:"default" }}>
              <div style={{ fontSize:9, fontWeight:700, letterSpacing:"0.13em", textTransform:"uppercase", color:"var(--text4)" }}>{m.l}</div>
              <div style={{ fontSize:23.5, fontWeight:800, color:m.c, lineHeight:1, letterSpacing:"-0.04em", fontFamily:MONO }}>{m.v}</div>
            </div>
          ))}
        </div>
        <div style={{ display:"flex", gap:6, alignItems:"center", flexShrink:0 }}>
          <button className="kn-newtask kn-press" onClick={startNew} style={{ height:36, padding:"0 17px", border:"none", borderRadius:"var(--r-sm)", fontSize:12.5, fontWeight:700, background:"var(--accent)", color:"#fff", cursor:"pointer", fontFamily:SANS, letterSpacing:"0.01em", boxShadow:"0 3px 12px rgba(28,92,170,0.32)", transition:"background 0.15s, box-shadow 0.15s", whiteSpace:"nowrap" }}>+ New {ENTITY_LABEL[tab.slice(0,-1)]}</button>
          <button className="kn-save-btn kn-press" onClick={() => { manualSave(); showToast("Saved"); }} style={{ height:36, padding:"0 13px", border:"1px solid var(--border)", borderRadius:"var(--r-sm)", fontSize:12, fontWeight:500, color:"var(--text3)", background:"transparent", cursor:"pointer", fontFamily:MONO, transition:"all 0.12s" }}>⌘S</button>
          <button onClick={() => setSettingsOpen(o => !o)} className="kn-press" style={{ width:36, height:36, borderRadius:"var(--r-sm)", border:`1px solid ${settingsOpen ? "var(--accent)" : "var(--border)"}`, background: settingsOpen ? "rgba(28,92,170,0.12)" : "transparent", color: settingsOpen ? "var(--accent-hover)" : "var(--text3)", cursor:"pointer", fontSize:15, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:SANS, transition:"all 0.15s" }}>⚙</button>
          <button onClick={() => setDark(d => !d)} title={dark ? "Switch to light" : "Switch to dark"} className="kn-press" style={{ width:32, height:32, borderRadius:"50%", border:"1.5px solid var(--border)", background:"transparent", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", transition:"border-color 0.18s", flexShrink:0 }}>
            <div style={{ width:10, height:10, borderRadius:"50%", background: dark ? "var(--text)" : "transparent", border: dark ? "none" : "2px solid var(--text)", transition:"all 0.18s" }}></div>
          </button>
        </div>
      </div>

      {/* NAV TABS + CONTROLS */}
      <div className={"kn-nav" + (tab === "tasks" ? "" : " kn-nav-empty")} style={{ height:40, borderBottom:"1px solid var(--border)", display:"flex", alignItems:"stretch", padding:"0 32px", background:"var(--surface)", flexShrink:0 }}>
        <div className="kn-tabs" style={{ display:"flex", height:"100%" }}>
          {TABS.map(({ key, label, count }) => (
            <button key={key} className="nav-tab" onClick={() => { setTab(key); setFilter("all"); setSearch(""); }} style={{ display:"flex", alignItems:"center", gap:5, padding:"0 15px", fontSize:12.5, fontWeight:tab === key ? 700 : 500, color: tab === key ? "var(--text)" : "var(--text3)", background:"transparent", border:"none", borderBottom: tab === key ? "2px solid var(--accent)" : "2px solid transparent", cursor:"pointer", fontFamily:SANS, letterSpacing:"-0.01em", transition:"color 0.15s", whiteSpace:"nowrap" }}>
              {label}
              {count !== "" && (
                <span style={{ fontSize:10.5, color:"var(--text4)", background:"var(--surface2)", padding:"1px 5px", borderRadius:3, fontFamily:MONO, fontWeight:600 }}>{count}</span>
              )}
            </button>
          ))}
        </div>
        {tab === "tasks" && (
          <div className="kn-controls" style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:8, animation:"slideDown 0.18s ease both" }}>
            <div className="kn-segment" style={{ display:"flex", alignItems:"center", gap:2, flexShrink:0, background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:999, padding:3, height:32 }}>
              {[["all","All"],["overdue","Overdue"],["blocked","Blocked"]].map(([val,lbl]) => {
                const on = filter === val;
                return (
                  <button key={val} onClick={() => setFilter(val)} className="kn-press" style={{ height:"100%", padding:"0 14px", cursor:"pointer", border:"none", borderRadius:999, fontSize:12, fontWeight:on ? 700 : 500, color: on ? "var(--text)" : "var(--text3)", background: on ? "var(--surface)" : "transparent", boxShadow: on ? "var(--sh-1)" : "none", fontFamily:SANS, transition:"all 0.2s var(--ease-smooth)", whiteSpace:"nowrap" }}>{lbl}</button>
                );
              })}
            </div>
            <div className="kn-searchwrap" style={{ display:"flex", alignItems:"center", height:32, border:"1px solid var(--border)", borderRadius:999, overflow:"hidden", background:"var(--surface2)", paddingLeft:11 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text4)" strokeWidth="2.4" strokeLinecap="round" style={{ flexShrink:0 }}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input id="kn-search" className="kn-search" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search" style={{ border:"none", background:"transparent", color:"var(--text)", fontFamily:SANS, fontSize:16, padding:"0 13px 0 8px", outline:"none", width:150, height:"100%" }} />
            </div>
          </div>
        )}
      </div>

      {/* MAIN CONTENT */}
      <div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column", minHeight:0, background:"var(--bg)" }}>
        {tab === "tasks"     && <TasksView tasks={tasks} onStatusChange={onStatusChange} onDelete={onDeleteTask} onEdit={t => setModal({ kind:"task", item:t })} filter={filter} search={search} />}
        {tab === "projects"  && <ProjectsView projects={S.projects||[]} tasks={tasks} onEdit={p => setModal({ kind:"project", item:p })} onDelete={deleteProject} onAddTask={pid => setModal({ kind:"task", item:{ project:pid } })} />}
        {tab === "payments"  && <PaymentsView payments={S.payments||[]} onToggle={onTogglePayment} onEdit={p => setModal({ kind:"payment", item:p })} onDelete={deletePayment} />}
        {tab === "decisions" && <DecisionsView decisions={S.decisions||[]} onEdit={d => setModal({ kind:"decision", item:d })} onDelete={deleteDecision} />}
      </div>

      {/* FOOTER HINTS */}
      <div className="kn-footer" style={{ height:30, borderTop:"1px solid var(--border)", display:"flex", alignItems:"center", padding:"0 32px", background:"var(--surface)", flexShrink:0, justifyContent:"space-between" }}>
        <div className="kn-footer-keys" style={{ display:"flex", gap:14, alignItems:"center" }}>
          <Kbd k="N" label="new" />
          <Kbd k="/" label="search" />
          <Kbd k="⌘S" label="save" />
        </div>
        <span style={{ fontSize:11, color:"var(--text4)", fontFamily:MONO }}>{_lastSavedAt ? "Saved · " + new Date(_lastSavedAt).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) : "Auto-sync on"}</span>
      </div>

      {/* MOBILE BOTTOM TAB BAR (phone only) */}
      <div className="kn-bottom-nav">
        {TABS.map(({ key, label, count }) => {
          const on = tab === key;
          return (
            <button key={key} onClick={() => { setTab(key); setFilter("all"); setSearch(""); }} className="kn-press"
              style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:3, padding:"5px 0", border:"none", background:"transparent", cursor:"pointer", color: on ? "var(--accent-hover)" : "var(--text3)", position:"relative", fontFamily:SANS }}>
              <div style={{ position:"relative" }}>
                <TabIcon k={key} active={on} />
                {count !== "" && count > 0 && (
                  <span style={{ position:"absolute", top:-5, right:-9, minWidth:15, height:15, padding:"0 4px", borderRadius:999, background:on?"var(--accent)":"var(--text4)", color:"#fff", fontSize:9, fontWeight:700, fontFamily:MONO, display:"flex", alignItems:"center", justifyContent:"center", lineHeight:1 }}>{count}</span>
                )}
              </div>
              <span className="kn-bottom-tab-label" style={{ fontSize:11, fontWeight: on ? 700 : 500, letterSpacing:"-0.01em" }}>{label}</span>
            </button>
          );
        })}
      </div>

      {/* FLOATING ACTION BUTTON (phone only) */}
      <button onClick={startNew} aria-label="New" className="kn-fab kn-press"
        style={{ width:56, height:56, borderRadius:"50%", border:"none", background:"var(--accent)", color:"#fff", alignItems:"center", justifyContent:"center", fontSize:28, fontWeight:300, lineHeight:1, cursor:"pointer", boxShadow:"0 8px 24px rgba(28,92,170,0.5), 0 2px 8px rgba(0,0,0,0.3)", fontFamily:SANS }}>+</button>

      {settingsOpen && <SettingsPanel onClose={() => setSettingsOpen(false)} onAddRole={onAddRole} onRenameRole={onRenameRole} onToast={showToast} />}
      {modal && <EntityModal kind={modal.kind} item={modal.item} projects={S.projects||[]} onClose={() => setModal(null)} onSave={f => { saveEntity(modal.kind, f); setModal(null); }} onDelete={id => { deleteEntity(modal.kind, id); setModal(null); }} />}

      {toastMsg && (
        <div className="kn-toast" style={{ position:"fixed", bottom:44, right:20, background:"var(--glass-bg)", backdropFilter:"var(--glass)", WebkitBackdropFilter:"var(--glass)", border:"1px solid var(--border2)", borderRadius:999, padding:"10px 18px", fontSize:13, fontWeight:600, color:"var(--text)", zIndex:400, boxShadow:"var(--sh-2)", animation:"fadeSlide 0.28s var(--ease-spring) both", pointerEvents:"none" }}>{toastMsg}</div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
